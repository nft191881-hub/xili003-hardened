<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaX Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="chat">
    <div class="phone-shell">
      <div class="status-bar">
        <span>9:41</span>
        <div class="signal">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="app-inner">
        <div class="header-row">
          <h1>社区</h1>
          <div class="icon-btn">✦</div>
        </div>

        <div class="card-box">
          <div class="section-head">
            <h2>群聊</h2>
            <div class="more">在线 21</div>
          </div>

          <div id="chatList" class="chat-list"></div>

          <div class="chat-input-box">
            <input id="chatInput" class="field" type="text" placeholder="输入消息..." />
            <button class="submit-btn" id="sendChatButton" type="button" style="width:auto; padding:12px 16px; margin-top:0;">发送</button>
          </div>
        </div>
      </div>

      <div class="bottom-nav">
        <a class="nav-item" href="./index.html"><span class="icon">⌂</span>首页</a>
        <a class="nav-item" href="./wallet.html"><span class="icon">◎</span>钱包</a>
        <a class="nav-item" href="./trade.html"><span class="icon">⇄</span>交易</a>
        <a class="nav-item active" href="./chat.html"><span class="icon">☰</span>聊天</a>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
