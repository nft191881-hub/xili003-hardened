<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaX Wallet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="wallet">
    <div class="phone-shell">
      <div class="status-bar">
        <span>9:41</span>
        <div class="signal">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="app-inner">
        <div class="header-row">
          <h1>钱包</h1>
          <div class="icon-btn">+</div>
        </div>

        <div class="wallet-block">
          <div class="wallet-top">
            <span class="wallet-label">资产净值</span>
            <span class="pill">+ 4.2%</span>
          </div>
          <div class="wallet-balance" id="walletTotal">$0</div>
          <div class="wallet-foot">
            <span class="wallet-sub" id="walletInfo">本月收益 $0</span>
            <span class="wallet-sub" id="walletAvailable">可用 0</span>
          </div>
        </div>

        <div class="card-box">
          <div class="section-head">
            <h2>持仓资产</h2>
            <div class="more">查看</div>
          </div>

          <div id="walletAssets" class="asset-list"></div>
        </div>

        <div class="card-box">
          <div class="section-head">
            <h2>交易记录</h2>
            <div class="more">全部</div>
          </div>

          <div id="walletOrders" class="order-list"></div>
        </div>
      </div>

      <div class="bottom-nav">
        <a class="nav-item" href="./index.html"><span class="icon">⌂</span>首页</a>
        <a class="nav-item active" href="./wallet.html"><span class="icon">◎</span>钱包</a>
        <a class="nav-item" href="./trade.html"><span class="icon">⇄</span>交易</a>
        <a class="nav-item" href="./chat.html"><span class="icon">☰</span>聊天</a>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
